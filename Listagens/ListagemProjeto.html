<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projetos</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="ListagemProjeto.css">
</head>

<body>
    <div class="app">
        <nav id="menu"></nav>
        <main id="main"></main>
    </div>
    <script>var ROOT = "../";</script>
    <script src="../app.js"></script>
    <script>
        M.innerHTML = head("Projetos", "", '<a class="btn" href="../Cadastros/CadatroProjeto.html">Cadastrar projeto</a>') + (db.projetos.length ? '<div class="card tw"><table><tr><th>Título</th><th>Aluno</th><th>Data</th><th>Tecnologias</th><th></th></tr>' + db.projetos.map(function (p) { var a = by(db.alunos, p.alunoId); return '<tr><td>' + esc(p.titulo) + '</td><td>' + (a ? esc(a.nome) : "—") + '</td><td>' + fmt(p.data) + '</td><td>' + esc(p.tags) + '</td><td><button class="btn ghost sm" data-del="projetos:' + p.id + '">Excluir</button></td></tr>' }).join("") + '</table></div>' : empty("Nenhum projeto cadastrado.", "Cadastros/CadatroProjeto.html", "Cadastrar projeto"));
    </script>
</body>

</html>
